services:
  sessile:
    build:
      context: .
      args:
        # Local builds are "dev"; override with VERSION=0.2.0 docker compose up.
        VERSION: ${VERSION:-dev}
    image: sessile:${VERSION:-dev}
    container_name: sessile
    ports:
      - "8080:8080"
    volumes:
      # config.yml, users.yml, per-user hosts.yml, sessions.db, scrollback
      # and history — the small, sensitive state (PROJECT_PLAN.md §9).
      - ./data/config:/config
      # The local-host sandbox root, only reachable once an admin turns on
      # allowLocalHost in Settings — irrelevant if every session targets an
      # SSH host instead.
      - ./data/workspace:/workspace
    restart: unless-stopped

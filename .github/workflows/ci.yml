name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # go vet says nothing about formatting, so without this two files drifted
      # out of gofmt shape and stayed that way across several PRs.
      # `gofmt -l` alone is not a check: it exits 0 even when it lists files.
      - name: gofmt
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd — run 'gofmt -w' on them:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (type-check + bundle)
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm run test

  docker:
    name: Docker ${{ matrix.variant }} (build + smoke test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: alpine
            target: runtime-alpine
          - variant: ubuntu
            target: runtime-ubuntu
    steps:
      - uses: actions/checkout@v4
        with:
          # The upgrade test below finds the previous release with
          # git describe, which needs the tags.
          fetch-depth: 0

      # No tag to compare against on a PR, but this still catches a hardcoded
      # version sneaking back into a placeholder — long before release time.
      - name: Version placeholders intact
        run: scripts/check-version.sh

      - uses: docker/setup-buildx-action@v3

      # Single-arch here: this job is about catching a broken image on the PR,
      # not producing artifacts. The release workflow does the multi-arch push.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: sessile:${{ matrix.variant }}
          build-args: VERSION=ci
          cache-from: type=gha,scope=ci-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.variant }}

      - name: Smoke test
        run: scripts/smoke-docker.sh sessile:${{ matrix.variant }}

      # For cmd/wsclient, which the upgrade test drives the WebSocket with.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The upgrade an operator does (§12e M35): the last published release
      # writes the data, this build has to start on it with nothing lost.
      - name: Upgrade test from the previous release
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
          suffix="${{ matrix.variant == 'ubuntu' && '-ubuntu' || '' }}"
          scripts/upgrade-smoke.sh "ghcr.io/andste82/sessile:${prev#v}${suffix}" sessile:${{ matrix.variant }}

      # And across several releases at once, from the oldest one still
      # supported: 0.5.0 is the first with accounts, the API the test uses.
      - name: Upgrade test from 0.5.0
        run: |
          suffix="${{ matrix.variant == 'ubuntu' && '-ubuntu' || '' }}"
          scripts/upgrade-smoke.sh "ghcr.io/andste82/sessile:0.5.0${suffix}" sessile:${{ matrix.variant }}
